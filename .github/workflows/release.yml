name: Release

on:
  push:
    tags:
      - 'v*'
    # A release/<version> branch publishes too. The tag is created by the
    # release step, so this works from environments that cannot push tags.
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Optional code signing. Add the repository secrets CSC_LINK and
      # CSC_KEY_PASSWORD (see docs/SIGNING.md); without them the build is
      # unsigned and Windows SmartScreen will warn until the download earns
      # reputation.
      - name: Configure code signing
        id: signing
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "${CSC_LINK_SECRET:-}" ]; then
            {
              echo "CSC_LINK<<SIGNING_EOF"
              echo "$CSC_LINK_SECRET"
              echo "SIGNING_EOF"
            } >> "$GITHUB_ENV"
            {
              echo "CSC_KEY_PASSWORD<<SIGNING_EOF"
              echo "$CSC_KEY_PASSWORD_SECRET"
              echo "SIGNING_EOF"
            } >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Certificate configured: build will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CSC_LINK secret configured - building unsigned. See docs/SIGNING.md."
          fi

      - name: Build
        run: npm run build

      - name: Package (installer + portable)
        run: npx electron-builder --win --publish never

      # rcedit must have written the icon, product name, version and publisher
      # into both executables; SmartScreen and Defender read that metadata.
      - name: Check executable metadata
        shell: pwsh
        run: |
          Get-ChildItem build -Filter *.exe | ForEach-Object {
            $v = $_.VersionInfo
            Write-Host ("{0}: {1} {2} - {3}" -f $_.Name, $v.ProductName, $v.FileVersion, $v.CompanyName)
            if (-not $v.ProductName) { throw "$($_.Name) is missing version metadata." }
          }

      - name: Verify signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem build -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host ("{0}: {1} - {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { throw 'One or more executables are not validly signed.' }

      # electron-updater polls latest.yml and downloads only the changed blocks,
      # so both files must reach the release or installed copies stop updating.
      - name: Check update feed
        shell: bash
        run: |
          test -f build/latest.yml || { echo "::error::latest.yml was not generated."; exit 1; }
          ls build/*.blockmap >/dev/null || { echo "::error::No .blockmap generated."; exit 1; }
          echo "Update feed: build/latest.yml"
          cat build/latest.yml

      - name: SHA-256 checksums (log)
        shell: bash
        run: |
          cd build
          sha256sum *.exe

      # Both platform jobs build independently; the release job publishes once.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: |
            build/*.exe
            build/latest.yml
            build/*.blockmap

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # deb for the package manager and AppImage for a self-contained app that
      # electron-updater can replace in place.
      - name: Package (.deb + AppImage)
        run: npx electron-builder --linux --x64 --publish never

      - name: Check packages and update feed
        shell: bash
        run: |
          set -euo pipefail
          ls -lh build
          deb=$(find build -maxdepth 1 -name '*.deb' -print -quit)
          appimage=$(find build -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$deb" || { echo "::error::No .deb was generated."; exit 1; }
          test -n "$appimage" || { echo "::error::No AppImage was generated."; exit 1; }
          test -f build/latest-linux.yml || { echo "::error::latest-linux.yml was not generated."; exit 1; }

          echo "Package: $(dpkg-deb -f "$deb" Package)"
          echo "Version: $(dpkg-deb -f "$deb" Version)"
          echo "Architecture: $(dpkg-deb -f "$deb" Architecture)"
          # Do not pipe into `grep -q`: it closes the pipe after the first match,
          # and with `pipefail` that SIGPIPE would fail the whole job.
          desktop=$(dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/share/applications/check-space.desktop)
          grep -q '^Exec=' <<<"$desktop"
          contents=$(dpkg-deb -c "$deb")
          grep -q 'usr/share/icons/.*/check-space.png' <<<"$contents"

          # An AppImage is only useful if its runtime and desktop entry are
          # complete; extracting it checks both without needing FUSE or a display.
          chmod +x "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/check-space.desktop
          rm -rf squashfs-root

          grep -q 'url:.*\.AppImage' build/latest-linux.yml
          echo "Update feed: build/latest-linux.yml"
          cat build/latest-linux.yml

      - name: SHA-256 checksums (log)
        shell: bash
        run: |
          cd build
          sha256sum *.deb *.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          if-no-files-found: error
          path: |
            build/*.deb
            build/*.AppImage
            build/latest-linux.yml

  release:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          path: release-assets
          merge-multiple: true

      # Tag push -> that tag. Manual run -> "v<package.json version>" (created by the release step).
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # A release/<version> branch is the source of truth: move the tag to this
      # commit so the published tag matches the binaries it produced. Pushes
      # made with GITHUB_TOKEN do not trigger another workflow run.
      - name: Point tag at this commit
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

      - name: SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.exe *.AppImage *.deb *.yml > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Check Space ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes/${{ steps.version.outputs.tag }}.md
          files: release-assets/*
