appId: com.diskscanner.app
productName: Check Space
copyright: Copyright © 2026 Pausiar
directories:
  buildResources: resources
  output: build

# Only the compiled app and its production dependencies belong in app.asar.
# Without this, docs, sources and local agent/skill files are shipped too.
files:
  - out/**/*
  - package.json

# Where the update feed lives. electron-builder writes latest.yml (Windows),
# latest-linux.yml (AppImage) and app-update.yml (read by the installed app)
# from this block, so releases must keep those files next to the packages. See
# docs/UPDATES.md before changing it.
publish:
  provider: github
  owner: Pausiar
  repo: check-space
  releaseType: release

# The MIT notice and the privacy notice must travel with every copy, and they
# also let antivirus tooling see consistent publisher information.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: PRIVACY.md
    to: PRIVACY.txt
  # Runtime window icon (the .desktop file also gets one from linux.icon).
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - nsis
    - portable
  # Multi-resolution ICO (16-256 px). Embedding it and the version metadata into
  # the exe (rcedit) is what SmartScreen and Defender look at first.
  icon: resources/icon.ico
  # Do not set publisherName while the builds are unsigned: electron-builder
  # copies it into app-update.yml and electron-updater then rejects every update
  # whose installer is not signed by that publisher. Once CSC_LINK is
  # configured, electron-builder reads the name from the certificate itself.
  # Signing is driven by the environment: set CSC_LINK (a .pfx, base64 or URL)
  # and CSC_KEY_PASSWORD, and every build is signed. See docs/SIGNING.md.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Check Space
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # In-place updates download only the changed blocks (the .blockmap file),
  # so an update costs far less than the full installer.
  differentialPackage: true
  # Named explicitly: the update URL comes from latest.yml, and a name without
  # spaces survives every proxy and CDN unchanged.
  artifactName: "CheckSpace-Setup-${version}.exe"

portable:
  artifactName: "CheckSpace-Portable.exe"

# Linux x64. The .deb is owned by the package manager; the AppImage updates
# itself through electron-updater (it needs latest-linux.yml next to the file).
linux:
  target:
    - deb
    - AppImage
  icon: resources/icon.png
  packageCategory: utils
  category: Utility
  synopsis: Free disk space analyzer for Windows and Linux
  description: >-
    Visualise what is using space on your disk, find large and duplicate files
    and free up storage without sending any data to a server.
  maintainer: Pausiar
  executableName: check-space
  desktop:
    Name: Check Space
    Comment: Analyze disk usage and free up space
    Categories: Utility;System;
    Keywords: disk;space;storage;cleanup;
    # Must match the WM_CLASS Electron reports for this app, not the product
    # name, or the taskbar groups it with a generic Electron icon.
    StartupWMClass: disk-scanner

appImage:
  artifactName: "CheckSpace-${version}-${arch}.AppImage"

deb:
  artifactName: "CheckSpace-${version}-${arch}.deb"
  # Keep the Debian package named after the executable, not the repository.
  packageName: check-space
