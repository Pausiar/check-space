appId: com.diskscanner.app
productName: Check Space
copyright: Copyright © 2026 Pausiar
directories:
  buildResources: resources
  output: build

# The MIT notice and the privacy notice must travel with every copy, and they
# also let antivirus tooling see consistent publisher information.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: PRIVACY.md
    to: PRIVACY.txt

win:
  target:
    - nsis
    - portable
  # Multi-resolution ICO (16-256 px). Embedding it and the version metadata into
  # the exe (rcedit) is what SmartScreen and Defender look at first.
  icon: resources/icon.ico
  publisherName: Pausiar
  # Signing itself is driven by the environment: set CSC_LINK (a .pfx, base64 or
  # URL) and CSC_KEY_PASSWORD, and every build is signed. See docs/SIGNING.md.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Check Space
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

portable:
  artifactName: "CheckSpace-Portable.exe"
